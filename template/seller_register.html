{% extends 'base.html' %}
{% block title %} Seller Register {% endblock title %}
{% block body %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm border-0 p-4">
        <h2 class="fw-bold mb-3">Become a Seller</h2>
        <p class="text-muted">Create your store profile and start listing products in minutes.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" name="username" required></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
          <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
          <div class="mb-3"><label class="form-label">Shop Name</label><input type="text" class="form-control" name="shop_name" required></div>
          <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" name="phone"></div>
          <div class="mb-3"><label class="form-label">Address</label><textarea class="form-control" name="address"></textarea></div>
          <button class="btn btn-primary" type="submit">Register Seller</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
