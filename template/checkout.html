{% extends 'base.html' %}
{% block title %} Checkout {% endblock title %}
{% block body %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm border-0 p-4">
        <h2 class="fw-bold mb-3">Checkout</h2>
        <p class="text-muted">Enter your delivery details to place the order.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label">Shipping Address</label><textarea class="form-control" name="address" required></textarea></div>
          <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" name="phone" required></div>
          <button class="btn btn-success" type="submit">Pay Now</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
